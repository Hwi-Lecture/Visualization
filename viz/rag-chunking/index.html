<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서를 어떻게 자를까? — 청킹 - 강의 시각화 자료실</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  body { max-width: 1240px; }

  .viz-root {
    --series-1: #2a78d6;   /* 홀수 청크 */
    --series-2: #eb6834;   /* 짝수 청크 · 강조 */
    --tint-1: #e8f0fb;
    --tint-2: #fdeee6;
    --muted-ink: #898781;
    --gridline: #e1e0d9;
  }

  /* ── 컨트롤 (스크롤해도 위에 붙어 있게) ───────────────── */
  .controls.sticky {
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
  }

  /* 좁은 화면에서는 컨트롤이 화면 절반을 덮어 버리므로 붙여 두지 않는다 */
  @media (max-width: 700px) {
    .controls.sticky { position: static; }
    .slider-group input[type="range"] { width: 140px; }
  }


  .controls button {
    font-size: 1rem;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text);
    cursor: pointer;
  }

  .controls button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .controls button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    font-weight: 600;
  }
  .controls button.primary:hover:not(:disabled) { background: #1f5590; color: #ffffff; }

  .slider-group { display: flex; align-items: center; gap: 9px; }
  .slider-group input[type="range"] { width: 190px; }
  .slider-group input:disabled + .slider-value { opacity: 0.4; }

  .slider-value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--text);
    min-width: 54px;
  }

  .btn-group { display: flex; gap: 0; }
  .btn-group button { border-radius: 0; margin-left: -1px; }
  .btn-group button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
  .btn-group button:last-child { border-radius: 0 7px 7px 0; }

  .mode-note { font-size: 0.88rem; color: var(--muted-ink); width: 100%; margin-top: -6px; }

  /* ── 업로드 ─────────────────────────────────────────── */
  .upload {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    border: 2px dashed #c9c8c1;
    border-radius: 10px;
    padding: 18px 20px;
    background: #fcfcfa;
    transition: border-color 0.15s, background 0.15s;
  }

  .upload.drag { border-color: var(--accent); background: #eef4fb; }
  .upload .icon { font-size: 1.8rem; line-height: 1; }
  .upload .msg { flex: 1; min-width: 220px; }
  .upload .msg strong { display: block; font-size: 1.02rem; }
  .upload .msg span { font-size: 0.86rem; color: var(--muted-ink); }

  .upload label.pick {
    font-size: 0.95rem;
    padding: 9px 16px;
    border-radius: 7px;
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .upload label.pick:hover { background: #1f5590; }
  .upload input[type="file"] { display: none; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 18px 0 10px;
    font-size: 0.9rem;
    color: var(--muted-ink);
  }

  .card-btn {
    font-size: 0.85rem;
    padding: 5px 11px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text);
    cursor: pointer;
  }

  .card-btn:hover { border-color: var(--accent); color: var(--accent); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }
  .swatch.c0 { background: var(--tint-1); border: 1px solid var(--series-1); }
  .swatch.c1 { background: var(--tint-2); border: 1px solid var(--series-2); }
  .swatch.ov { background-image: repeating-linear-gradient(-45deg, #c5daf6 0 4px, #f9cdb4 4px 8px); }

  /* ── 문서 섹션 (문서 하나 = 한 줄 전체) ─────────────── */
  #docs { display: flex; flex-direction: column; gap: 18px; }

  .doc {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px 16px;
    background: #ffffff;
    min-width: 0;
  }

  .doc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .doc-head h3 { margin: 0; font-size: 1.05rem; line-height: 1.4; word-break: break-all; }
  .doc-head .spacer { flex: 1; }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 4px;
    padding: 2px 7px;
    white-space: nowrap;
    background: #f0efea;
    color: #5f5e58;
  }
  .badge.pdf { background: #fbe4e1; color: #a2382b; }
  .badge.docx { background: #e1ebfa; color: #24599e; }
  .badge.text { background: #e9f2e4; color: #3f6a2c; }

  .close {
    border: none;
    background: none;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--muted-ink);
    cursor: pointer;
    padding: 2px 4px;
  }
  .close:hover { color: #c0392b; }

  .doc-meta {
    font-size: 0.8rem;
    color: var(--muted-ink);
    margin: 2px 0 10px;
    font-variant-numeric: tabular-nums;
  }

  .doc-stats { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 10px; }
  .doc-stats .label { font-size: 0.76rem; color: var(--muted-ink); }
  .doc-stats .value { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .doc-stats .value small { font-size: 0.78rem; font-weight: 400; color: var(--muted-ink); }

  /* 청크 막대: 문서 전체를 가로 한 줄로 펼친 지도. 홀수 청크는 윗줄, 짝수 청크는 아랫줄에 놓아
     겹침이 있으면 위아래 칸이 가로로 포개지는 게 그대로 보인다. */
  .bar {
    position: relative;
    height: 30px;
    border-radius: 4px;
    background: #f4f3ef;
    margin-bottom: 4px;
    cursor: pointer;
  }

  .bar .blk {
    position: absolute;
    height: 13px;
    min-width: 1px;
    border-radius: 2px;
    box-sizing: border-box;
  }
  .bar .blk.c0 { top: 1px; background: var(--tint-1); border: 1px solid var(--series-1); }
  .bar .blk.c1 { top: 16px; background: var(--tint-2); border: 1px solid var(--series-2); }
  .bar .blk.hl { background: var(--series-1); z-index: 1; }
  .bar .blk.c1.hl { background: var(--series-2); }

  .bar-axis {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--muted-ink);
    font-variant-numeric: tabular-nums;
    margin-bottom: 12px;
  }

  /* ── 청크 카드 그리드 ───────────────────────────────── */
  .chunk-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px;
  }

  @media (max-width: 480px) { .chunk-grid { grid-template-columns: 1fr; } }

  .chunk-card {
    border: 1px solid var(--border);
    border-top: 4px solid var(--series-1);
    border-radius: 7px;
    padding: 8px 10px 9px;
    font-size: 0.82rem;
    line-height: 1.65;
    min-width: 0;
    display: flex;
    flex-direction: column;
    scroll-margin-top: 160px;
    transition: box-shadow 0.15s;
  }
  .chunk-card.c1 { border-top-color: var(--series-2); }
  .chunk-card.hl { background: #fffaf0; box-shadow: 0 0 0 2px #e0b450; }

  .chunk-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.74rem;
    color: var(--muted-ink);
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  .chunk-head b { color: var(--text); font-size: 0.8rem; }

  .chunk-card .body {
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 210px;
    overflow-y: auto;
    color: #333;
  }

  /* 앞·뒤 청크와 겹치는 부분 — 이 글자들은 두 청크에 똑같이 들어 있다 */
  .chunk-card .ov {
    background-image: repeating-linear-gradient(-45deg, #c5daf6 0 5px, #f9cdb4 5px 10px);
    border-radius: 2px;
  }

  .grid-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .grid-foot .note { font-size: 0.85rem; color: var(--muted-ink); }

  .status { padding: 30px 6px; text-align: center; color: var(--muted-ink); font-size: 0.92rem; }
  .status.error { color: #a2382b; background: #fdf1ef; border-radius: 6px; padding: 18px 12px; }

  .empty {
    text-align: center;
    color: var(--muted-ink);
    padding: 50px 0;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

</style>
</head>
<body>
  <div id="viz-nav"></div>

  <h1>문서를 어떻게 자를까? — 청킹(chunking)</h1>
  <p>
    RAG는 문서를 통째로 넣지 않습니다. <strong>먼저 잘게 자르고, 나중에 그 조각(청크)을 찾아옵니다.</strong>
    갖고 계신 PDF나 Word 문서를 올려서, 아래 설정에 따라 문서가 어디서 잘리는지 직접 확인해 보세요.
  </p>

  <div class="viz-root">
    <div class="upload" id="upload">
      <span class="icon" aria-hidden="true">📄</span>
      <div class="msg">
        <strong>여기에 문서를 끌어다 놓으세요</strong>
        <span>PDF · Word(.docx) · 텍스트(.txt, .md) · 여러 개 한꺼번에 가능 ·
          파일은 서버로 보내지 않고 이 브라우저 안에서만 읽습니다</span>
      </div>
      <label class="pick" for="file-input">파일 선택</label>
      <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md">
    </div>

    <div class="controls sticky">
      <div class="btn-group" id="mode-group">
        <button data-mode="fixed">고정 길이</button>
        <button data-mode="sentence">문장 경계</button>
        <button data-mode="paragraph">문단 경계</button>
      </div>
      <div class="slider-group">
        <label for="size">청크 크기</label>
        <input type="range" id="size" min="100" max="2000" step="10" value="300">
        <span class="slider-value" id="size-value">300자</span>
      </div>
      <div class="slider-group">
        <label for="overlap">겹침(overlap)</label>
        <input type="range" id="overlap" min="0" max="500" step="10" value="50">
        <span class="slider-value" id="overlap-value">50자</span>
      </div>
      <button id="btn-reset">기본값으로</button>
      <div class="mode-note" id="mode-note"></div>
    </div>

    <div class="toolbar">
      <div class="legend">
        <span><i class="swatch c0"></i>청크 (홀수)</span>
        <span><i class="swatch c1"></i>청크 (짝수)</span>
        <span><i class="swatch ov"></i>앞뒤 청크와 겹치는 글자</span>
      </div>
    </div>

    <div id="docs"></div>
  </div>

  <script src="../../common/nav.js"></script>
  <script src="../rag-shared/corpus.js"></script>
  <script src="extract.js"></script>
  <script src="script.js"></script>
</body>
</html>
