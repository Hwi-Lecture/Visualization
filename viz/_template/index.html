<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시각화 제목 - 강의 시각화 자료실</title>
<link rel="stylesheet" href="../../common/style.css">
<!-- 수식이 필요 없으면 아래 KaTeX 두 줄은 지워도 됨 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- 시각화 라이브러리: 필요 없는 건 지우면 됨 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <div id="viz-nav"></div>

  <h1>시각화 제목</h1>
  <p>이 시각화가 무엇을 보여주는지 한두 문장으로 설명.</p>

  <div class="controls">
    <!-- 예: <label>학습률 <input type="range" id="lr" min="0.001" max="1" step="0.001"></label> -->
  </div>

  <div id="viz-root" class="viz-canvas"></div>

  <script src="../../common/nav.js"></script>
  <script src="script.js"></script>
  <script>
    // KaTeX 자동 렌더링 (본문에 $...$ 또는 $$...$$ 로 수식 작성 가능)
    document.addEventListener("DOMContentLoaded", () => {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    });
  </script>
</body>
</html>
