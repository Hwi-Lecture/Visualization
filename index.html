<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 시각화 자료실</title>
<link rel="stylesheet" href="common/style.css">
</head>
<body>
  <h1>강의 시각화 자료실</h1>
  <p>강의에서 사용하는 인터랙티브 시각화 자료 모음입니다.</p>
  <div class="card-grid" id="card-grid"></div>

  <script>
    fetch("viz.json")
      .then(res => res.json())
      .then(items => {
        const grid = document.getElementById("card-grid");
        if (!items.length) {
          grid.innerHTML = '<p style="color:#888;">아직 등록된 시각화가 없습니다.</p>';
          return;
        }
        grid.innerHTML = items.map(item => `
          <a class="card" href="${item.path}">
            <h3>${item.title}</h3>
            <p>${item.description}</p>
          </a>
        `).join("");
      })
      .catch(() => {
        document.getElementById("card-grid").innerHTML =
          '<p style="color:#888;">viz.json을 불러오지 못했습니다. (로컬에서는 간단한 서버로 열어야 fetch가 동작합니다: 예) python -m http.server)</p>';
      });
  </script>
</body>
</html>
