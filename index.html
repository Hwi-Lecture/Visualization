<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 시각화 자료실</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; text-decoration: none; color: inherit; }
  .card:hover { background: #f5f5f5; }
</style>
</head>
<body>
  <h1>강의 시각화 자료실</h1>
  <p>강의에서 사용하는 인터랙티브 시각화 자료 모음입니다.</p>
  <div class="card-grid">
    <!-- 자료 추가 시 여기에 카드 추가 -->
  </div>
</body>
</html>
